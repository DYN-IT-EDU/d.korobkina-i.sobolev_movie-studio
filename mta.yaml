_schema-version: 3.3.0
ID: movie-studio
description: A simple CAP project.
version: 1.0.0
modules:
- name: movie-studio-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: movie-studio-db
  - name: movie-studio-auth
  - name: movie-studio-destination
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    disk-quota: 512M
    memory: 512M
    readiness-health-check-http-endpoint: /health
    readiness-health-check-type: http
  build-parameters:
    builder: npm
- name: movie-studio-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: movie-studio-db
  parameters:
    buildpack: nodejs_buildpack
- name: movie-studio-app-deployer
  type: com.sap.application.content
  path: .
  requires:
  - name: movie-studio-html5-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources/
    requires:
    - artifacts:
      - HTML5Module-content.zip
      name: HTML5Module
      target-path: resources/
- name: HTML5Module
  type: html5
  path: app/HTML5Module
  build-parameters:
    build-result: .
    builder: custom
    commands:
    - npm run build
    supported-platforms: []
- name: movie-studio-destinations
  type: com.sap.application.content
  requires:
  - name: movie-studio-auth
    parameters:
      service-key:
        name: movie-studio-auth-key
  - name: movie-studio-html5-repo-host
    parameters:
      service-key:
        name: movie-studio-html5-repo-host-key
  - name: srv-api
  - name: movie-studio-destination
    parameters:
      content-target: true
  parameters:
    content:
      instance:
        destinations:
        - Name: movie-studio-html5-repository
          ServiceInstanceName: movie-studio-html5-repo-host
          ServiceKeyName: movie-studio-html5-repo-host-key
          sap.cloud.service: basic.service
        - Authentication: OAuth2UserTokenExchange
          Name: movie-studio-auth
          ServiceInstanceName: movie-studio-auth
          ServiceKeyName: movie-studio-auth-key
          sap.cloud.service: basic.service
        existing_destinations_policy: update
  build-parameters:
    no-source: true
resources:
- name: movie-studio-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: movie-studio-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: movie-studio-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: movie-studio-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: movie-studio-app-srv
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
    service: destination
    service-plan: lite
  requires:
  - name: srv-api
    group: destinations
    properties:
      forwardAuthToken: true
      name: srv-api
      url: ~{srv-url}
- name: movie-studio-html5-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
parameters:
  appname: movie-studio-managed
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
    - mkdir -p resources
