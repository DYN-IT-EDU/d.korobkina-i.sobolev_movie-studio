_schema-version: 3.3.0
ID: movie-studio
description: A simple CAP project.
version: 1.0.1
modules:
- name: movie-studio-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: movie-studio-db
  - name: movie-studio-auth
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    readiness-health-check-http-endpoint: /health
    readiness-health-check-type: http
  build-parameters:
    builder: npm
- name: movie-studio-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: movie-studio-db
  parameters:
    buildpack: nodejs_buildpack
- name: movie-studio-approuter
  type: approuter.nodejs
  path: movie-studio-approuter
  requires:
  - name: movie-studio_html_repo_runtime
  - name: movie-studio-auth
  - name: movie-studio-srv-destination
  - name: ui5-flexibility-keyuser
    group: destinations
    properties:
      forwardAuthToken: false
      name: ui5
      url: https://ui5.sap.com
  parameters:
    disk-quota: 256M
    memory: 256M
- name: movie-studio_ui_deployer
  type: com.sap.application.content
  path: .
  requires:
  - name: movie-studio_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - nsscenesweb.zip
      name: nsscenesweb
      target-path: resources/
- name: nsscenesweb
  type: html5
  path: app/scenes-web
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: movie-studio-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: movie-studio-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: movie-studio-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: movie-studio-srv-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            HTML5.ForwardAuthToken: true
            Name: movie-studio-backend
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: ignore
      version: 1.0.0
    service: destination
    service-name: movie-studio-srv-destination
    service-plan: lite
  requires:
  - name: srv-api
    group: destinations
- name: movie-studio_html_repo_runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
- name: movie-studio_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: ui5-flexibility-keyuser
  parameters:
    service-plan: trial
    service: ui5-flexibility-keyuser
  type: org.cloudfoundry.managed-service
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
