_schema-version: 3.3.0
ID: movie-studio
description: A simple CAP project.
version: 1.0.1
modules:
- name: movie-studio-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: movie-studio-db
  - name: movie-studio-auth
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    readiness-health-check-http-endpoint: /health
    readiness-health-check-type: http
  build-parameters:
    builder: npm
- name: hello-world-destination-content
  type: com.sap.application.content
  requires:
  - name: movie-studio-auth
  - name: hello-world_html_repo_host
  - name: movie-studio-srv
  - name: movie-studio-srv-destination
    parameters:
      content-target: true
  parameters:
    content:
      instance:
        destinations:
        - Name: my_service_hello_world_html_repo_host
          ServiceInstanceName: hello-world_html_repo_host
          ServiceKeyName: hello-world_html_repo_host-key
          sap.cloud.service: basic.service
        - Authentication: OAuth2UserTokenExchange
          Name: my_service_uaa_hello_world
          ServiceInstanceName: movie-studio-auth
          ServiceKeyName: movie-studio-auth-key
          sap.cloud.service: basic.service
        existing_destinations_policy: update
  build-parameters:
    no-source: true
- name: movie-studio-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: movie-studio-db
  parameters:
    buildpack: nodejs_buildpack
- name: hello-world_ui_deployer
  type: com.sap.application.content
  path: .
  requires:
  - name: hello-world_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - nsscenesweb.zip
      name: nsscenesweb
      target-path: resources/
- name: nsscenesweb
  type: html5
  path: app/scenes-web
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: movie-studio-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: movie-studio-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: movie-studio-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: movie-studio-srv-destination
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: true
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            HTML5.ForwardAuthToken: true
            Name: movie-studio-backend
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: movie-studio-srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: ignore
      version: 1.0.0
    service: destination
    service-name: movie-studio-srv-destination
    service-plan: lite
  requires:
  - name: srv-api
    group: destinations
- name: hello-world_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-keys:
    - name: hello-world_html_repo_host-key
    service-plan: app-host
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
